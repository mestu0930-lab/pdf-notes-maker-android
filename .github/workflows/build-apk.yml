# .github/workflows/build-apk.yml
# Fixed: Node.js 24 compatible action versions
# Fixed: libffi/cffi build conflict resolved via buildozer.spec

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Opt into Node.js 24 for all actions now (before June 2nd forced migration)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout code
      uses: actions/checkout@v4   # v4.2+ supports Node 24 via FORCE flag above

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Wait for system lock
      run: |
        for i in {1..60}; do
          if ! sudo lsof /var/lib/apt/lists/lock > /dev/null 2>&1 && \
             ! sudo lsof /var/cache/apt/archives/lock > /dev/null 2>&1 && \
             ! sudo lsof /var/lib/dpkg/lock* > /dev/null 2>&1; then
            echo "System ready"
            break
          fi
          echo "Waiting for package manager... ($i/60)"
          sleep 5
        done

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          libffi-dev \
          libssl-dev \
          libxml2-dev \
          libxslt1-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          libtiff-dev \
          libfreetype6-dev \
          openjdk-11-jdk-headless \
          git \
          wget \
          unzip \
          ca-certificates \
          autoconf \
          automake \
          libtool \
          pkg-config \
          lld

    - name: Setup Java environment
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
        java -version

    - name: Setup Android SDK paths
      run: |
        mkdir -p ~/Android/Sdk
        echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
        echo "$HOME/Android/Sdk/tools:$HOME/Android/Sdk/tools/bin:$HOME/Android/Sdk/platform-tools" >> $GITHUB_PATH

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache buildozer global
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install python-for-android==2023.9.16

    - name: Install host-side project dependencies
      run: |
        pip install requests markdown pypdf python-docx \
                    python-dateutil aiofiles six urllib3 \
                    certifi charset-normalizer idna || true

    - name: Clean old builds
      run: |
        rm -rf .buildozer/android/platform/build-* 2>/dev/null || true
        rm -rf bin/*.apk 2>/dev/null || true

    - name: Build APK
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        export ANDROID_HOME=$HOME/Android/Sdk
        export PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools
        buildozer android debug

    - name: Check APK generation
      run: |
        echo "=== Checking for APK files ==="
        if find bin -name "*.apk" -type f 2>/dev/null | grep -q .; then
          echo "✅ APK found successfully!"
          ls -lh bin/*.apk
        else
          echo "❌ No APK found"
          find . -name "*.apk" 2>/dev/null || echo "No APK files anywhere"
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: pdf-notes-maker-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: .buildozer/
        retention-days: 7
        if-no-files-found: ignore
