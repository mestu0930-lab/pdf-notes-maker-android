# .github/workflows/build-apk.yml
# Fix: libffi autoreconf fails with autoconf 2.72 (Ubuntu 24 default).
# Solution: downgrade autoconf to 2.71 which is compatible with p4a's libffi recipe.

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Wait for system lock
      run: |
        for i in {1..60}; do
          if ! sudo lsof /var/lib/apt/lists/lock > /dev/null 2>&1 && \
             ! sudo lsof /var/cache/apt/archives/lock > /dev/null 2>&1 && \
             ! sudo lsof /var/lib/dpkg/lock* > /dev/null 2>&1; then
            echo "System ready"
            break
          fi
          echo "Waiting for package manager... ($i/60)"
          sleep 5
        done

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          wget \
          unzip \
          ca-certificates \
          openjdk-11-jdk-headless \
          libffi-dev \
          libssl-dev \
          libxml2-dev \
          libxslt1-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          libtiff-dev \
          libfreetype6-dev \
          libtool \
          pkg-config \
          lld \
          cmake \
          m4

    # Ubuntu 24 ships autoconf 2.72 which breaks p4a's old libffi recipe.
    # Downgrade to 2.71 which is the last version compatible with that configure.ac.
    - name: Install autoconf 2.71 (fixes libffi LT_SYS_SYMBOL_USCORE error)
      run: |
        sudo apt-get remove -y autoconf automake 2>/dev/null || true
        cd /tmp
        wget -q https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.gz
        tar xzf autoconf-2.71.tar.gz
        cd autoconf-2.71
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        autoconf --version | head -1

        wget -q https://ftp.gnu.org/gnu/automake/automake-1.16.5.tar.gz
        cd /tmp
        tar xzf automake-1.16.5.tar.gz
        cd automake-1.16.5
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        automake --version | head -1

    - name: Setup Java
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
        java -version

    - name: Setup Android SDK paths
      run: |
        mkdir -p ~/Android/Sdk
        echo "ANDROID_HOME=$HOME/Android/Sdk"     >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
        echo "$HOME/Android/Sdk/tools:$HOME/Android/Sdk/tools/bin:$HOME/Android/Sdk/platform-tools" >> $GITHUB_PATH

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-autoconf271
        restore-keys: ${{ runner.os }}-buildozer-

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "Cython>=3.0.0,<3.1.0"
        pip install buildozer==1.5.0
        pip install "python-for-android==2024.1.21"

    - name: Install host-side dependencies
      run: |
        pip install requests markdown pypdf python-docx \
                    python-dateutil aiofiles six urllib3 \
                    certifi charset-normalizer idna || true

    - name: Clean old builds
      run: |
        rm -rf .buildozer/android/platform/build-* 2>/dev/null || true
        rm -rf bin/*.apk 2>/dev/null || true

    - name: Build APK
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        export ANDROID_HOME=$HOME/Android/Sdk
        export PATH=/usr/local/bin:$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools
        buildozer android debug

    - name: Check APK
      run: |
        if find bin -name "*.apk" -type f 2>/dev/null | grep -q .; then
          echo "✅ APK built successfully!"
          ls -lh bin/*.apk
        else
          echo "❌ No APK found"
          find . -name "*.apk" 2>/dev/null || true
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: pdf-notes-maker-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: .buildozer/
        retention-days: 7
        if-no-files-found: ignore
