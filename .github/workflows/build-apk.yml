name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          libxml2-dev \
          libxslt1-dev \
          zlib1g-dev \
          openjdk-11-jdk-headless \
          android-sdk \
          gradle
    
    - name: Set up Android SDK
      run: |
        mkdir -p ~/Android/Sdk
        export ANDROID_HOME=~/Android/Sdk
        
        # Download NDK
        cd ~/Android/Sdk
        mkdir -p cmdline-tools
        cd cmdline-tools
        
        # Use sdkmanager to install components
        apt-get install -y android-sdk-build-tools android-sdk-platform-tools
    
    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip
        pip install cython
        pip install buildozer
        pip install -r requirements.txt
    
    - name: Configure Buildozer
      run: |
        # Create buildozer cache directory
        mkdir -p ~/.buildozer
        mkdir -p ~/.buildozer/android/platform
        
        # Update buildozer.spec with correct version
        sed -i 's/package.name = pdfnotesmaker/package.name = pdfnotesmaker/g' buildozer.spec
        sed -i 's/version = 1.0.0/version = 1.0.0/g' buildozer.spec
    
    - name: Build APK (Debug)
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools
        
        # Build with longer timeout
        timeout 3600 buildozer android debug 2>&1 || echo "Build attempted"
    
    - name: Check build output
      run: |
        find . -name "*.apk" -type f
        ls -lh bin/ || echo "No bin directory yet"
        ls -lh .buildozer/ | head -20 || echo "No buildozer directory"
    
    - name: Upload APK as artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pdf-notes-maker-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: build-logs
        path: |
          .buildozer/android/platform/build-**/build/outputs/logs/
          ~/.buildozer/logs/
        retention-days: 7
