name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-v2
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          wget \
          unzip \
          ca-certificates \
          openjdk-11-jdk-headless \
          libffi-dev \
          libssl-dev \
          libxml2-dev \
          libxslt1-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          libtiff-dev \
          libfreetype6-dev \
          libtool \
          libtool-bin \
          libltdl-dev \
          autoconf \
          automake \
          pkg-config \
          lld \
          cmake \
          m4

    - name: Setup Java
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
        java -version

    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "Cython>=3.0.0,<3.1.0"
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Build APK (Debug)
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        buildozer android debug

    - name: Check APK
      run: |
        if find bin -name "*.apk" -type f 2>/dev/null | grep -q .; then
          echo "✅ APK built successfully!"
          ls -lh bin/*.apk
        else
          echo "❌ No APK found"
          find . -name "*.apk" 2>/dev/null || true
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: pdf-notes-maker-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          /home/runner/.buildozer/
        retention-days: 7
        if-no-files-found: ignore
