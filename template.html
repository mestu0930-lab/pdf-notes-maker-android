<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PDF Notes Maker - Generated Notes</title>
    
    <!-- Google Fonts: Noto Sans + Noto Sans Mono (with all weights) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========== System Color-Emoji Font Fallback ========== */
        @font-face {
            font-family: 'EmojiFallback';
            src: local('Segoe UI Emoji'), 
                 local('Apple Color Emoji'), 
                 local('Noto Color Emoji'),
                 local('Twemoji Mozilla'),
                 local('Noto Emoji');
            unicode-range: U+1F300-1F5FF, U+1F600-1F64F, U+1F680-1F6FF, 
                           U+1F900-1F9FF, U+1FA00-1FA6F, U+1FA70-1FAFF,
                           U+2600-26FF, U+2700-27BF, U+200D, U+FE0F;
        }

        /* ========== Base Styles ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 
                         'Roboto', 'Helvetica Neue', sans-serif,
                         'EmojiFallback', 'Segoe UI Emoji', 'Apple Color Emoji',
                         'Noto Color Emoji';
            line-height: 1.6;
            color: #2c3e50;
            background-color: #ffffff;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        body {
            padding: 1.5rem;
            padding-top: 2rem;
            padding-bottom: 2rem;
            font-size: 16px;
        }

        /* ========== Mobile Responsive ========== */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
                font-size: 15px;
                line-height: 1.5;
            }
        }

        /* ========== Headings ========== */
        h1, h2, h3, h4, h5, h6 {
            color: #1a1a2e;
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.3;
        }

        h1 { font-size: 2em; margin-top: 0.5em; }
        h2 { font-size: 1.6em; }
        h3 { font-size: 1.3em; }
        h4 { font-size: 1.1em; }
        h5 { font-size: 1em; }
        h6 { font-size: 0.9em; color: #555; }

        @media (max-width: 600px) {
            h1 { font-size: 1.6em; }
            h2 { font-size: 1.3em; }
            h3 { font-size: 1.1em; }
            h4 { font-size: 1em; }
        }

        /* ========== Text Formatting ========== */
        p {
            margin-bottom: 1em;
        }

        b, strong {
            font-weight: 700;
            color: #1a1a2e;
        }

        i, em {
            font-style: italic;
        }

        u, ins {
            text-decoration: underline;
        }

        s, del {
            text-decoration: line-through;
            color: #888;
        }

        code, .code {
            font-family: 'Noto Sans Mono', 'Courier New', 'Courier', monospace;
            background-color: #f4f4f4;
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            padding: 0.2em 0.4em;
            font-size: 0.9em;
            color: #d63384;
        }

        /* ========== Code Blocks ========== */
        pre, .highlight {
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            padding: 1em;
            overflow-x: auto;
            margin: 1em 0;
            font-family: 'Noto Sans Mono', monospace;
            font-size: 0.9em;
            line-height: 1.4;
        }

        pre code, .highlight code {
            background-color: transparent;
            border: none;
            padding: 0;
            color: #333;
        }

        /* ========== Lists ========== */
        ul, ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        li {
            margin-bottom: 0.5em;
        }

        ul li {
            list-style-type: disc;
        }

        ul ul li {
            list-style-type: circle;
        }

        ul ul ul li {
            list-style-type: square;
        }

        ol li {
            list-style-type: decimal;
        }

        ol ol li {
            list-style-type: lower-alpha;
        }

        /* ========== Blockquotes ========== */
        blockquote {
            border-left: 4px solid #007bff;
            margin: 1em 0;
            padding: 0.5em 1em;
            background-color: #f0f8ff;
            color: #1a5490;
            font-style: italic;
        }

        blockquote p {
            margin: 0.5em 0;
        }

        /* ========== Tables ========== */
        table {
            border-collapse: collapse;
            margin: 1.5em 0;
            width: 100%;
            overflow-x: auto;
            display: block;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 0.75em;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #f2f2f2;
            font-weight: 700;
            color: #1a1a2e;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        @media (max-width: 600px) {
            table {
                font-size: 0.9em;
            }
            th, td {
                padding: 0.5em;
            }
        }

        /* ========== Links ========== */
        a {
            color: #007bff;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }

        a:hover {
            color: #0056b3;
            border-bottom: 1px solid #0056b3;
            text-decoration: underline;
        }

        a:visited {
            color: #6f42c1;
        }

        /* ========== Horizontal Rule ========== */
        hr {
            border: none;
            border-top: 2px solid #ddd;
            margin: 2em 0;
        }

        /* ========== Images ========== */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1em 0;
        }

        figure {
            margin: 1.5em 0;
            text-align: center;
        }

        figcaption {
            font-size: 0.9em;
            color: #666;
            font-style: italic;
            margin-top: 0.5em;
        }

        /* ========== Math (MathJax) ========== */
        .math {
            font-family: 'Noto Sans Mono', monospace;
        }

        /* Inline math */
        .math.inline {
            display: inline;
        }

        /* Display math (block) */
        .math.block {
            display: block;
            margin: 1em 0;
            text-align: center;
        }

        /* MathJax SVG rendering */
        svg[role="img"] {
            max-width: 100%;
            height: auto;
        }

        /* ========== Utility Classes ========== */
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .text-justify { text-align: justify; }

        .text-muted { color: #888; }
        .text-success { color: #28a745; }
        .text-danger { color: #dc3545; }
        .text-warning { color: #ffc107; color: #333; }
        .text-info { color: #17a2b8; }

        .mt-1 { margin-top: 0.5em; }
        .mt-2 { margin-top: 1em; }
        .mt-3 { margin-top: 1.5em; }

        .mb-1 { margin-bottom: 0.5em; }
        .mb-2 { margin-bottom: 1em; }
        .mb-3 { margin-bottom: 1.5em; }

        /* ========== Print/PDF Export ========== */
        @media print {
            body {
                background-color: white;
                color: black;
                font-size: 12pt;
            }

            /* Avoid breaking elements */
            h1, h2, h3, h4, h5, h6,
            p, li, table, tr, th, td,
            pre, blockquote, figure {
                page-break-inside: avoid;
            }

            h1, h2, h3, h4, h5, h6 {
                page-break-after: avoid;
            }

            /* Widows and orphans control */
            p, li {
                orphans: 3;
                widows: 3;
            }

            /* Page margins */
            @page {
                margin: 2cm 1.5cm;
            }

            /* Hide links styling in print */
            a {
                color: #333;
                text-decoration: underline;
            }

            /* Adjust for print */
            pre {
                background-color: #f5f5f5;
                border: 1px solid #ccc;
            }

            table {
                border: 1px solid #ccc;
            }
        }

        /* ========== Dark Mode Support ========== */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1e1e1e;
                color: #e0e0e0;
            }

            h1, h2, h3, h4, h5, h6 {
                color: #ffffff;
            }

            code {
                background-color: #2d2d2d;
                border-color: #444;
                color: #ff7b7b;
            }

            pre {
                background-color: #2d2d2d;
                border-color: #444;
                color: #e0e0e0;
            }

            blockquote {
                background-color: #2a3a4a;
                color: #b0d4ff;
                border-left-color: #4a9eff;
            }

            table {
                border-color: #444;
            }

            th {
                background-color: #2d2d2d;
                color: #ffffff;
            }

            tr:nth-child(even) {
                background-color: #252525;
            }

            tr:hover {
                background-color: #333;
            }

            a {
                color: #4a9eff;
            }

            a:visited {
                color: #b399ff;
            }

            hr {
                border-top-color: #444;
            }
        }
    </style>
</head>
<body>
    <div id="content_root">{{CONTENT}}</div>

    <!-- ========== MathJax v3 Configuration ========== -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ],
                processEscapes: true,
                processEnvironments: true
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                pageReady: () => {
                    window.renderingComplete = true;
                    console.log('[MathJax] Rendering complete');
                }
            }
        };
    </script>

    <!-- MathJax from CDN (jsDelivr - reliable global CDN) -->
    <script id="MathJax-script" 
            async 
            src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
            crossorigin="anonymous"
            integrity="sha384-nHIStND3eMIqR2dYaILBeLc1xS2c5TrMp33K5IOCyQTnyuwkzFFfjS3n7j6E/FS8">
    </script>

    <!-- Fallback error handling -->
    <script>
        // Set timeout for rendering completion
        window.renderingComplete = false;
        window.renderingTimeout = setTimeout(() => {
            if (!window.renderingComplete) {
                console.warn('[MathJax] Rendering timeout - marking as complete');
                window.renderingComplete = true;
            }
        }, 10000);  // 10 second timeout

        // Fallback rendering function
        async function renderAllDiagrams() {
            try {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    await window.MathJax.typesetPromise();
                    console.log('[MathJax] Rendering successful');
                } else {
                    console.warn('[MathJax] MathJax not fully loaded, marking complete anyway');
                }
            } catch (error) {
                console.error('[MathJax] Rendering error:', error);
            } finally {
                window.renderingComplete = true;
                clearTimeout(window.renderingTimeout);
            }
        }

        // Call rendering when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderAllDiagrams);
        } else {
            renderAllDiagrams();
        }

        // Also call after a short delay to ensure MathJax has loaded
        setTimeout(renderAllDiagrams, 1000);
    </script>
</body>
</html>
